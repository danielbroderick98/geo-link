# Local development and tests use their own SQLite files.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# Heroku supplies DATABASE_URL when PostgreSQL is attached.
# All production tables share that database, including the Solid adapters.
production:
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
